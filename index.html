<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Clash!</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #101018; color: white; font-family: Arial, sans-serif;
    padding: 16px;
  }
  .wrap { width: min(100%, 1000px); }
  h1 { text-align: center; margin: 0 0 10px; color: #D745EE; letter-spacing: 2px; }
  .help { text-align: center; color: #d8d8e6; margin: 0 0 12px; font-size: 14px; }
  .gamebox { position: relative; border: 3px solid #29293c; border-radius: 12px; overflow: hidden; box-shadow: 0 0 28px #0009; }
  canvas { display: block; width: 100%; height: auto; background: #000; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: #000b; text-align: center; padding: 20px;
  }
  .panel { background: #171322; border: 2px solid #D745EE; border-radius: 16px; padding: 24px; max-width: 90%; box-shadow: 0 0 24px #D745EE44; }
  .panel h2 { margin: 0 0 12px; color: #D745EE; font-size: clamp(26px, 5vw, 42px); }
  .panel p { line-height: 1.5; margin: 8px 0 18px; }
  button {
    border: 0; border-radius: 10px; padding: 12px 22px; font-size: 16px; font-weight: bold;
    color: #100817; background: #ED4B9C; cursor: pointer;
  }
  button:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .mobile-controls { display: none; margin: 12px auto 0; width: 190px; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .mobile-controls button { padding: 12px 0; font-size: 20px; }
  .mobile-controls button:nth-child(1) { grid-column: 2; }
  .mobile-controls button:nth-child(2) { grid-column: 1; grid-row: 2; }
  .mobile-controls button:nth-child(3) { grid-column: 2; grid-row: 2; }
  .mobile-controls button:nth-child(4) { grid-column: 3; grid-row: 2; }
  @media (max-width: 650px) { .mobile-controls { display: grid; } .help { font-size: 12px; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>🐍 SNAKE CLASH!</h1>
  <p class="help">Move with the arrow keys or WASD • Collect food and small enemies • Avoid the big enemies!</p>
  <div class="gamebox">
    <canvas id="game" width="1000" height="700" aria-label="Snake Clash game"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2>🐍 SNAKE CLASH!</h2>
        <p>Survive for 60 seconds, collect food and small enemies, and grow your snake.<br>Watch out for the big enemies!</p>
        <button id="startBtn">START GAME</button>
      </div>
    </div>
  </div>
  <div class="mobile-controls" aria-label="Movement controls">
    <button data-dir="up" aria-label="Move up">▲</button>
    <button data-dir="left" aria-label="Move left">◀</button>
    <button data-dir="down" aria-label="Move down">▼</button>
    <button data-dir="right" aria-label="Move right">▶</button>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  const W = canvas.width, H = canvas.height;
  const PURPLE = '#D745EE', PINK = '#ED4B9C';
  let player, body, smallEnemies, bigEnemies, foods;
  let score = 0, timeLeft = 60, running = false;
  let lastTime = 0, spawnSmall = 0, spawnBig = 0, spawnFood = 0, invulnerableUntil = 0;
  let animationId = null;

  function randomPos() {
    return { x: 45 + Math.random() * (W - 90), y: 75 + Math.random() * (H - 120) };
  }
  function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function circle(x, y, r, fill, stroke = null, lineWidth = 2) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.lineWidth = lineWidth; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function drawPlayer() {
    // A custom, self-contained snake head replaces the external snake.gif.
    ctx.save(); ctx.translate(player.x, player.y);
    circle(0, 0, 22, '#42E5A5', '#D9FFF0', 3);
    circle(7, -6, 4, '#07150F'); circle(7, 7, 4, '#07150F');
    circle(8, -7, 1.5, '#FFFFFF'); circle(8, 6, 1.5, '#FFFFFF');
    ctx.restore();
  }
  function drawBodySegment(segment, index) {
    circle(segment.x, segment.y, Math.max(10, 17 - index * 0.15), '#43CDA0', '#146B57', 2);
  }
  function drawSmall(enemy) {
    // Small enemy (ss.gif replacement)
    circle(enemy.x, enemy.y, 15, '#37E75C', '#D4FFDA', 2);
    circle(enemy.x - 5, enemy.y - 3, 3, '#073B13');
    circle(enemy.x + 5, enemy.y - 3, 3, '#073B13');
    ctx.strokeStyle = '#073B13'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y + 2, 6, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  function drawBig(enemy) {
    // Big enemy (bs.gif replacement)
    ctx.save(); ctx.translate(enemy.x, enemy.y);
    ctx.fillStyle = '#8B3FE8'; ctx.strokeStyle = '#E2C6FF'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const angle = -Math.PI / 2 + i * Math.PI / 5;
      const radius = i % 2 === 0 ? 26 : 19;
      const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    circle(-7, -3, 4, '#FFFFFF'); circle(7, -3, 4, '#FFFFFF');
    circle(-6, -3, 2, '#1B092A'); circle(8, -3, 2, '#1B092A');
    ctx.restore();
  }
  function drawFood(food) {
    circle(food.x, food.y, 11, '#FFE83D', '#FFF9B2', 2);
    ctx.fillStyle = '#43DB62'; ctx.fillRect(food.x - 1, food.y - 17, 4, 7);
  }
  function drawHud() {
    ctx.fillStyle = PURPLE; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`Time : ${Math.max(0, Math.ceil(timeLeft))}`, 115, 40);
    ctx.fillStyle = PINK; ctx.fillText(`Score : ${score}`, 115, 72);
    ctx.textAlign = 'left';
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    // subtle game area grid
    ctx.strokeStyle = '#101010'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    foods.forEach(drawFood);
    smallEnemies.forEach(drawSmall);
    bigEnemies.forEach(drawBig);
    // body is drawn from tail to head
    body.slice().reverse().forEach((segment, i) => drawBodySegment(segment, i));
    drawPlayer();
    drawHud();
  }
  function spawnEnemy() {
    const p = randomPos();
    smallEnemies.push({ ...p, vx: -(1.3 + Math.random() * 1.1), vy: (Math.random() - 0.5) * 0.8 });
  }
  function spawnBigEnemy() {
    const p = randomPos();
    bigEnemies.push({ ...p, vx: -(0.8 + Math.random() * 0.7), vy: (Math.random() - 0.5) * 0.6 });
  }
  function spawnNewFood() {
    foods.push(randomPos());
  }
  function addScore() {
    score++;
    body.push({ x: player.x - 30 * (body.length + 1), y: player.y });
  }
  function resetGame() {
    player = { x: W / 2, y: H / 2, speed: 5 };
    body = [];
    smallEnemies = [];
    bigEnemies = [];
    foods = [];
    score = 0; timeLeft = 60; running = true;
    spawnSmall = 0; spawnBig = 0; spawnFood = 0; lastTime = 0; invulnerableUntil = 0;
    overlay.style.display = 'none';
    if (animationId !== null) cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(loop);
  }
  function endGame(reason = 'Time is up!') {
    if (!running) return;
    running = false;
    overlay.style.display = 'grid';
    overlay.innerHTML = `<div class="panel"><h2>GAME OVER!</h2><p>${reason}<br><strong>Final Score: ${score}</strong></p><button id="restartBtn">PLAY AGAIN</button></div>`;
    document.getElementById('restartBtn').addEventListener('click', resetGame);
  }
  function movePlayer(dx, dy) {
    if (!running) return;
    player.x = Math.max(25, Math.min(W - 25, player.x + dx * player.speed * 2.8));
    player.y = Math.max(55, Math.min(H - 25, player.y + dy * player.speed * 2.8));
  }
  const directions = {
    ArrowRight: () => movePlayer(1, 0), d: () => movePlayer(1, 0), D: () => movePlayer(1, 0),
    ArrowLeft: () => movePlayer(-1, 0), a: () => movePlayer(-1, 0), A: () => movePlayer(-1, 0),
    ArrowUp: () => movePlayer(0, -1), w: () => movePlayer(0, -1), W: () => movePlayer(0, -1),
    ArrowDown: () => movePlayer(0, 1), s: () => movePlayer(0, 1), S: () => movePlayer(0, 1)
  };
  window.addEventListener('keydown', e => {
    if (directions[e.key]) { e.preventDefault(); directions[e.key](); }
  });
  document.querySelectorAll('[data-dir]').forEach(button => {
    const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    button.addEventListener('click', () => movePlayer(...dirs[button.dataset.dir]));
  });
  function loop(timestamp) {
    if (!running) return;
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min(50, timestamp - lastTime);
    lastTime = timestamp;
    const seconds = dt / 1000;
    timeLeft -= seconds;
    if (timeLeft <= 0) { timeLeft = 0; draw(); endGame('Time is up!'); return; }

    spawnSmall += dt; spawnBig += dt; spawnFood += dt;
    if (spawnSmall >= 1000) { spawnSmall %= 1000; spawnEnemy(); }
    if (spawnBig >= 5000) { spawnBig %= 5000; spawnBigEnemy(); }
    if (spawnFood >= 3000) { spawnFood %= 3000; spawnNewFood(); }

    smallEnemies.forEach(enemy => {
      enemy.x += enemy.vx * (dt / 16.67);
      enemy.y += enemy.vy * (dt / 16.67);
      if (enemy.y < 35 || enemy.y > H - 25) enemy.vy *= -1;
    });
    bigEnemies.forEach(enemy => {
      enemy.x += enemy.vx * (dt / 16.67);
      enemy.y += enemy.vy * (dt / 16.67);
      if (enemy.y < 45 || enemy.y > H - 30) enemy.vy *= -1;
    });

    for (let i = smallEnemies.length - 1; i >= 0; i--) {
      if (distance(smallEnemies[i], player) < 38) {
        smallEnemies.splice(i, 1); addScore();
      } else if (smallEnemies[i].x < -40) smallEnemies.splice(i, 1);
    }
    for (let i = bigEnemies.length - 1; i >= 0; i--) {
      if (distance(bigEnemies[i], player) < 43) {
        draw(); endGame('A big enemy caught you!'); return;
      } else if (bigEnemies[i].x < -45) bigEnemies.splice(i, 1);
    }
    for (let i = foods.length - 1; i >= 0; i--) {
      if (distance(foods[i], player) < 35) {
        foods.splice(i, 1); addScore();
      }
    }

    // Body segments trail behind the player's previous positions.
    let previous = { x: player.x, y: player.y };
    for (const segment of body) {
      const dx = previous.x - segment.x, dy = previous.y - segment.y;
      const d = Math.hypot(dx, dy);
      const gap = 28;
      if (d > gap) {
        segment.x += (dx / d) * (d - gap) * 0.38;
        segment.y += (dy / d) * (d - gap) * 0.38;
      }
      previous = segment;
    }
    draw();
    animationId = requestAnimationFrame(loop);
  }
  startBtn.addEventListener('click', resetGame);
  draw();
})();
</script>
</body>
</html>
