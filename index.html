<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Clash!</title>
<style>
    body {
        margin: 0;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: #fff;
        overflow: hidden;
    }
    h1 {
        margin: 5px 0;
        font-size: 1.5em;
        color: #D745EE;
    }
    #gameContainer {
        position: relative;
        box-shadow: 0 0 30px rgba(215, 69, 238, 0.3);
        border: 3px solid #333;
        border-radius: 6px;
    }
    canvas {
        background: #000000;
        display: block;
    }
    #startOverlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }
    button {
        padding: 12px 28px;
        font-size: 1.2em;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid #ED4B9C;
        border-radius: 6px;
        background: #D745EE;
        color: #fff;
        transition: 0.2s;
    }
    button:hover {
        background: #ED4B9C;
        transform: scale(1.05);
    }
    .controls-hint {
        margin-top: 15px;
        color: #aaa;
        font-size: 0.95em;
        text-align: center;
        line-height: 1.5;
    }
</style>
</head>
<body>

<h1>Snake Clash! 🐍</h1>
<div id="gameContainer">
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
    
    <div id="startOverlay">
        <h2 style="color:#D745EE; margin-bottom:10px;">Ready for Snake Clash?</h2>
        <button id="startBtn">START GAME</button>
        <div class="controls-hint">
            Use <b>Arrow Keys</b> to move (+50px steps)<br>
            Eat <b>Yellow Food</b> & <b>Small Enemies (ss.gif)</b> to grow & score!<br>
            Avoid <b>Big Enemies (bs.gif)</b>!
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const startOverlay = document.getElementById('startOverlay');

const ORIGIN_X = canvas.width / 2;  // 500
const ORIGIN_Y = canvas.height / 2; // 350

function toScreen(x, y) {
    return {
        x: ORIGIN_X + x,
        y: ORIGIN_Y - y
    };
}

function getDistance(x1, y1, x2, y2) {
    return Math.hypot(x1 - x2, y1 - y2);
}

const images = {};
const assetSources = {
    'snake.gif': { loaded: false, fallbackColor: '#4CAF50', type: 'player' },
    'ss.gif':    { loaded: false, fallbackColor: 'green',    type: 'ss' },
    'bs.gif':    { loaded: false, fallbackColor: 'red',      type: 'bs' },
    'skin.gif':  { loaded: false, fallbackColor: '#26D100',  type: 'skin' }
};

for (let key in assetSources) {
    const img = new Image();
    img.src = key;
    img.onload = () => { assetSources[key].loaded = true; };
    img.onerror = () => { assetSources[key].loaded = false; };
    images[key] = img;
}

let player = { x: 0, y: 0 };
let t = 60;
let s = 0;
let gameover = false;
let gameStarted = false;

let enemylist = [];
let bigenemylist = [];
let foodlist = [];
let bodylist = [];

let timerInterval = null;
let spawnIntervals = [];

function startCountdown() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (!gameover && t > 0) {
            t -= 1;
        } else if (t <= 0) {
            gameover = true;
        }
    }, 1000);
}

function startSpawners() {
    const ssTimer = setInterval(() => {
        if (!gameover && gameStarted) {
            enemylist.push({
                x: Math.floor(Math.random() * 501) - 250,
                y: Math.floor(Math.random() * 501) - 250
            });
        }
    }, 1000);

    const bsTimer = setInterval(() => {
        if (!gameover && gameStarted) {
            bigenemylist.push({
                x: Math.floor(Math.random() * 501) - 250,
                y: Math.floor(Math.random() * 501) - 250
            });
        }
    }, 5000);

    const foodTimer = setInterval(() => {
        if (!gameover && gameStarted) {
            foodlist.push({
                x: Math.floor(Math.random() * 501) - 250,
                y: Math.floor(Math.random() * 501) - 250
            });
        }
    }, 3000);

    spawnIntervals.push(ssTimer, bsTimer, foodTimer);
}

function clearAllIntervals() {
    if (timerInterval) clearInterval(timerInterval);
    spawnIntervals.forEach(id => clearInterval(id));
    spawnIntervals = [];
}

function bodyclone() {
    bodylist.push({ x: 0, y: 0 });
}

function handleKey(e) {
    if (!gameStarted || gameover) return;
    switch(e.key) {
        case 'ArrowRight':
        case 'Right':
            player.x += 50;
            e.preventDefault();
            break;
        case 'ArrowLeft':
        case 'Left':
            player.x -= 50;
            e.preventDefault();
            break;
        case 'ArrowUp':
        case 'Up':
            player.y += 50;
            e.preventDefault();
            break;
        case 'ArrowDown':
        case 'Down':
            player.y -= 50;
            e.preventDefault();
            break;
    }
}

function drawEntity(key, pyX, pyY, size = 30, fallbackShape = 'rect', fallbackColor = 'white') {
    const pos = toScreen(pyX, pyY);
    const meta = assetSources[key];
    
    if (meta && meta.loaded && images[key].complete && images[key].naturalWidth !== 0) {
        ctx.drawImage(images[key], pos.x - size, pos.y - size, size * 2, size * 2);
    } else {
        ctx.fillStyle = fallbackColor;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        if (fallbackShape === 'circle') {
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, size * 0.7, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else {
            ctx.fillRect(pos.x - size, pos.y - size, size * 2, size * 2);
            ctx.strokeRect(pos.x - size, pos.y - size, size * 2, size * 2);
        }
    }
}

function gameLoop() {
    for (let i = enemylist.length - 1; i >= 0; i--) {
        let enemy = enemylist[i];
        enemy.x -= 2;
        if (getDistance(enemy.x, enemy.y, player.x, player.y) < 50) {
            enemylist.splice(i, 1);
            s += 1;
            bodyclone();
        }
    }

    for (let i = 0; i < bigenemylist.length; i++) {
        let big = bigenemylist[i];
        big.x -= 2;
        if (getDistance(big.x, big.y, player.x, player.y) < 30) {
            gameover = true;
        }
    }

    for (let i = foodlist.length - 1; i >= 0; i--) {
        let food = foodlist[i];
        if (getDistance(food.x, food.y, player.x, player.y) < 50) {
            foodlist.splice(i, 1);
            s += 1;
            bodyclone();
        }
    }

    let offsetStep = 40;
    for (let i = 0; i < bodylist.length; i++) {
        bodylist[i].x = player.x - offsetStep;
        bodylist[i].y = player.y;
        offsetStep += 40;
    }

    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!gameover) {
        foodlist.forEach(f => {
            drawEntity('food', f.x, f.y, 15, 'circle', 'yellow');
        });

        enemylist.forEach(e => {
            drawEntity('ss.gif', e.x, e.y, 25, 'rect', 'green');
        });

        bigenemylist.forEach(b => {
            drawEntity('bs.gif', b.x, b.y, 35, 'rect', 'red');
        });

        bodylist.forEach(b => {
            drawEntity('skin.gif', b.x, b.y, 20, 'rect', '#26D100');
        });

        drawEntity('snake.gif', player.x, player.y, 30, 'rect', '#4CAF50');

        const timerPos = toScreen(-350, 310);
        ctx.fillStyle = "#D745EE";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`Time : ${t}`, timerPos.x, timerPos.y);

        const scorePos = toScreen(-350, 280);
        ctx.fillStyle = "#ED4B9C";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`Score : ${s}`, scorePos.x, scorePos.y);

        setTimeout(gameLoop, 10);
    } else {
        clearAllIntervals();
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const goPos = toScreen(0, 20);
        ctx.fillStyle = "#D745EE";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", goPos.x, goPos.y);

        const finalScorePos = toScreen(0, -20);
        ctx.fillStyle = "#ED4B9C";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`Score : ${s}`, finalScorePos.x, finalScorePos.y);

        ctx.fillStyle = "#fff";
        ctx.font = "18px Arial";
        const restartPos = toScreen(0, -80);
        ctx.fillText("Refresh page to play again", restartPos.x, restartPos.y);
    }
}

startBtn.addEventListener('click', () => {
    startOverlay.style.display = 'none';
    window.focus();
    gameStarted = true;
    gameover = false;
    t = 60;
    s = 0;
    player = { x: 0, y: 0 };
    enemylist = [];
    bigenemylist = [];
    foodlist = [];
    bodylist = [];

    window.addEventListener('keydown', handleKey);
    startCountdown();
    startSpawners();
    gameLoop();
});
</script>
</body>
</html>
